services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pkg_compliance
      POSTGRES_PASSWORD: pkg_compliance
      POSTGRES_DB: pkg_compliance
    # 5433 on the host: 5432 is taken by asset-directory-db locally.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
